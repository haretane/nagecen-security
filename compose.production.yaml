# KAGOYA VPSの本番環境専用です。
# ローカル開発では、このファイルではなく compose.yaml を使用します。
name: nagecen-security-production

services:
  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "80:80"
      - "443:443"
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?PUBLIC_DOMAIN is required}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    image: nagecen-security-backend:production
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@database:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      APP_ENV: production
      AUTH_SECRET_STORE_URL: redis://auth-secret-store:6379/0
      SECURITY_FRONTEND_URL: ${SECURITY_FRONTEND_URL:?SECURITY_FRONTEND_URL is required}
      NAGECEN_FRONTEND_URL: ${NAGECEN_FRONTEND_URL:?NAGECEN_FRONTEND_URL is required}
      NAGECEN_TO_SECURITY_KEY_ID: ${NAGECEN_TO_SECURITY_KEY_ID:?NAGECEN_TO_SECURITY_KEY_ID is required}
      NAGECEN_TO_SECURITY_HMAC_SECRET: ${NAGECEN_TO_SECURITY_HMAC_SECRET:?NAGECEN_TO_SECURITY_HMAC_SECRET is required}
      COOKIE_SECURE: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?CORS_ALLOWED_ORIGINS is required}
    expose:
      - "8000"
    depends_on:
      database:
        condition: service_healthy
      auth-secret-store:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  worker:
    image: nagecen-security-backend:production
    command: ["python", "-m", "app.worker.runner"]
    group_add:
      - ${DOCKER_GID:?DOCKER_GID is required}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?POSTGRES_USER is required}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@database:5432/${POSTGRES_DB:?POSTGRES_DB is required}
      APP_ENV: production
      AUTH_SECRET_STORE_URL: redis://auth-secret-store:6379/0
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable
      WORKER_IMAGE: nagecen-security-backend:production
      NAGECEN_CALLBACK_URL: ${NAGECEN_CALLBACK_URL:?NAGECEN_CALLBACK_URL is required}
      SECURITY_TO_NAGECEN_KEY_ID: ${SECURITY_TO_NAGECEN_KEY_ID:?SECURITY_TO_NAGECEN_KEY_ID is required}
      SECURITY_TO_NAGECEN_HMAC_SECRET: ${SECURITY_TO_NAGECEN_HMAC_SECRET:?SECURITY_TO_NAGECEN_HMAC_SECRET is required}
    depends_on:
      database:
        condition: service_healthy
      auth-secret-store:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  auth-secret-store:
    image: redis:7.4-alpine
    user: redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --dbfilename
      - ""
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - allkeys-lru
    tmpfs:
      - /data:size=32m,mode=0700,uid=100,gid=101
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - database-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 12
    restart: unless-stopped

volumes:
  caddy-data:
  caddy-config:
  database-data:
