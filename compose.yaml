services:
  frontend:
    build:
      context: ./frontend
    ports:
      - "${FRONTEND_PORT:-5174}:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
      VITE_SECURITY_ACCOUNT_LOGIN_ENABLED: ${VITE_SECURITY_ACCOUNT_LOGIN_ENABLED:-false}
      VITE_SECURITY_DIAGNOSTICS_PAUSED: ${VITE_SECURITY_DIAGNOSTICS_PAUSED:-true}
      VITE_NAGECEN_LOGIN_AUTHORIZE_URL: ${NAGECEN_LOGIN_AUTHORIZE_URL:-http://localhost:5173/nagecen/security-login}
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nagecen_security}:${POSTGRES_PASSWORD:-change-me-for-local-development}@database:5432/${POSTGRES_DB:-nagecen_security}
      APP_ENV: ${APP_ENV:-development}
      SECURITY_DIAGNOSTICS_PAUSED: ${SECURITY_DIAGNOSTICS_PAUSED:-true}
      AUTH_SECRET_STORE_URL: redis://auth-secret-store:6379/0
      SECURITY_FRONTEND_URL: ${SECURITY_FRONTEND_URL:-http://localhost:5174}
      NAGECEN_FRONTEND_URL: ${NAGECEN_FRONTEND_URL:-http://localhost:5173/nagecen}
      NAGECEN_TO_SECURITY_KEY_ID: ${NAGECEN_TO_SECURITY_KEY_ID:-local-v1}
      NAGECEN_TO_SECURITY_HMAC_SECRET: ${NAGECEN_TO_SECURITY_HMAC_SECRET:-local-development-handoff-secret-change-me}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5174,http://localhost:5173}
      SECURITY_ACCOUNT_LOGIN_ENABLED: ${SECURITY_ACCOUNT_LOGIN_ENABLED:-false}
      NAGECEN_LOGIN_AUTHORIZE_URL: ${NAGECEN_LOGIN_AUTHORIZE_URL:-http://localhost:5173/nagecen/security-login}
      NAGECEN_LOGIN_EXCHANGE_URL: ${NAGECEN_LOGIN_EXCHANGE_URL:-http://host.docker.internal:8080/api/exchange_security_login_code.php}
      NAGECEN_ACCOUNT_ISSUER: ${NAGECEN_ACCOUNT_ISSUER:-http://localhost:5173/nagecen/}
      SECURITY_TO_NAGECEN_LOGIN_KEY_ID: ${SECURITY_TO_NAGECEN_LOGIN_KEY_ID:-account-login-local-v1}
      SECURITY_TO_NAGECEN_LOGIN_HMAC_SECRET: ${SECURITY_TO_NAGECEN_LOGIN_HMAC_SECRET:-}
    depends_on:
      database:
        condition: service_healthy
      auth-secret-store:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker.runner"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nagecen_security}:${POSTGRES_PASSWORD:-change-me-for-local-development}@database:5432/${POSTGRES_DB:-nagecen_security}
      APP_ENV: ${APP_ENV:-development}
      AUTH_SECRET_STORE_URL: redis://auth-secret-store:6379/0
      ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:stable
      WORKER_IMAGE: nagecen-security-backend:latest
      NAGECEN_CALLBACK_URL: ${NAGECEN_CALLBACK_URL:-http://host.docker.internal:8080/api/security_callback.php}
      SECURITY_TO_NAGECEN_KEY_ID: ${SECURITY_TO_NAGECEN_KEY_ID:-security-local-v1}
      SECURITY_TO_NAGECEN_HMAC_SECRET: ${SECURITY_TO_NAGECEN_HMAC_SECRET:-local-development-webhook-secret-change-me}
    depends_on:
      database:
        condition: service_healthy
      auth-secret-store:
        condition: service_healthy
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  auth-secret-store:
    image: redis:7.4-alpine
    user: redis
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --dbfilename
      - ""
      - --maxmemory
      - 32mb
      - --maxmemory-policy
      - allkeys-lru
    tmpfs:
      - /data:size=32m,mode=0700,uid=100,gid=101
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  database:
    image: postgres:17-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nagecen_security}
      POSTGRES_USER: ${POSTGRES_USER:-nagecen_security}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-for-local-development}
    volumes:
      - nagecen-security-db-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test:
        - CMD-SHELL
        - "pg_isready -U ${POSTGRES_USER:-nagecen_security} -d ${POSTGRES_DB:-nagecen_security}"
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  frontend-node-modules:
  nagecen-security-db-data:
